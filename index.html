<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiang Mai Split Bills</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; max-width: 500px; margin: 0 auto; background: #f0f2f5; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2, h3 { margin-top: 0; color: #1a1a1a; }
        label { display: block; margin-top: 12px; font-weight: 600; font-size: 14px; }
        input, select, button { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        input:focus, select:focus { border-color: #007bff; outline: none; }
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 18px; transition: background 0.2s; }
        button:hover { background: #0056b3; }
        .refresh-btn { background: #28a745; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: left; }
        th { background-color: #f8f9fa; }
        .negative { color: #dc3545; font-weight: bold; }
        .positive { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🇹🇭 Chiang Mai Trip Bills</h2>
    
    <button class="refresh-btn" onclick="fetchLatestData()">🔄 Refresh Cloud Balances</button>

    <div class="card">
        <h3>Current Balances (HKD)</h3>
        <div id="loading">Loading current wallet status...</div>
        <table id="balanceTable" style="display:none;">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Paid</th>
                    <th>Owes</th>
                    <th>Balance</th>
                </tr>
            </thead>
            <tbody id="balanceBody"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>Add New Bill</h3>
        <form id="expenseForm">
            <label>Description</label>
            <input type="text" id="description" required placeholder="e.g., Night Market Khao Soi">

            <label>Currency</label>
            <select id="currency">
                <option value="THB">THB (฿)</option>
                <option value="HKD">HKD ($)</option>
            </select>

            <label>Amount</label>
            <input type="number" id="amount" step="0.01" required placeholder="0.00">

            <label>Paid By</label>
            <select id="paid_by">
                <option value="Mandy">Mandy</option>
                <option value="Winifred">Winifred</option>
                <option value="Mark">Mark</option>
            </select>

            <label>Split Rules</label>
            <select id="split_type" onchange="toggleSplitInputs()">
                <option value="equally">Split Equally Between All 3</option>
                <option value="by_amount">Split by Exact Amount</option>
                <option value="by_percentage">Split by Percentage (%)</option>
            </select>

            <div id="customSplitDetails" style="display:none; margin-top:12px; background:#f8f9fa; padding:12px; border-radius:8px; border:1px dashed #ccc;">
                <p id="splitHint" style="margin:0 0 8px 0; font-size:12px; color:#666;">Enter split shares:</p>
                <label style="margin-top:5px;">Mandy:</label>
                <input type="number" id="val_Mandy" value="0" step="0.01">
                <label style="margin-top:5px;">Winifred:</label>
                <input type="number" id="val_Winifred" value="0" step="0.01">
                <label style="margin-top:5px;">Mark:</label>
                <input type="number" id="val_Mark" value="0" step="0.01">
            </div>

            <button type="submit" id="submitBtn">🚀 Sync to Google Drive</button>
        </form>
    </div>

    <script>
        const SPREADSHEET_ID = '{{SPREADSHEET_ID}}';
        const API_KEY = '{{API_KEY}}';

        function toggleSplitInputs() {
            const type = document.getElementById('split_type').value;
            const customDiv = document.getElementById('customSplitDetails');
            const hint = document.getElementById('splitHint');
            
            if (type === 'equally') {
                customDiv.style.display = 'none';
            } else {
                customDiv.style.display = 'block';
                hint.innerText = type === 'by_percentage' ? 'Enter share in % (e.g. 50, 30, 20):' : 'Enter exact currency amounts:';
            }
        }

        async function fetchLatestData() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('balanceTable').style.display = 'none';
            try {
                const response = await fetch(`https://googleapis.com{SPREADSHEET_ID}/values/Balances!A1:D4?key=${API_KEY}`);
                const data = await response.json();
                
                if (data.values && data.values.length > 1) {
                    let rowsHtml = '';
                    for(let i = 1; i < data.values.length; i++) {
                        const row = data.values[i];
                        const balance = parseFloat(row[3] || 0);
                        const balClass = balance >= 0 ? 'positive' : 'negative';
                        rowsHtml += `<tr>
                            <td><strong>${row[0]}</strong></td>
                            <td>$${row[1]}</td>
                            <td>$${row[2]}</td>
                            <td class="${balClass}">$${balance.toFixed(2)}</td>
                        </tr>`;
                    }
                    document.getElementById('balanceBody').innerHTML = rowsHtml;
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('balanceTable').style.display = 'table';
                } else {
                    document.getElementById('loading').innerText = 'No computed balances yet. Add an expense first!';
                }
            } catch (error) {
                document.getElementById('loading').innerText = 'Syncing setup... Please submit your first bill row below.';
            }
        }

        document.getElementById('expenseForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Syncing...';
            
            const description = document.getElementById('description').value;
            const currency = document.getElementById('currency').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const paid_by = document.getElementById('paid_by').value;
            const split_type = document.getElementById('split_type').value;
            
            let mVal = 0, wVal = 0, mkVal = 0;
            if (split_type !== 'equally') {
                mVal = parseFloat(document.getElementById('val_Mandy').value || 0);
                wVal = parseFloat(document.getElementById('val_Winifred').value || 0);
                mkVal = parseFloat(document.getElementById('val_Mark').value || 0);
            }

            const rowValues = [[description, currency, amount, paid_by, split_type, mVal, wVal, mkVal]];

            try {
                const response = await fetch(`https://googleapis.com{SPREADSHEET_ID}/values/Expenses!A:H:append?valueInputOption=USER_ENTERED&key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ values: rowValues })
                });

                if (response.ok) {
                    alert('✈️ Bill logged directly to Google Drive successfully!');
                    document.getElementById('expenseForm').reset();
                    toggleSplitInputs();
                } else {
                    alert('Cloud Sync Error: Verify your Google Sheet is shared with "Anyone with link as Editor"');
                }
            } catch (error) {
                alert('Network Error: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = '🚀 Sync to Google Drive';
                fetchLatestData();
            }
        });

        window.onload = fetchLatestData;
    </script>
</body>
</html>
